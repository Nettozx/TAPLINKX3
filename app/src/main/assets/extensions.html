<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=640, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Extensions</title>
  <style>
    :root {
      --bg: #000000;
      --card: #0a0a0a;
      --line: rgba(255, 255, 255, .08);
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --ok: #7ed68a;
    }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, Segoe UI, Roboto, sans-serif;
    }

    main {
      box-sizing: border-box;
      width: 100%;
      max-width: 640px;
      padding: 10px 14px 24px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
      flex: 1;
    }

    h2 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 0 6px;
    }

    .btn {
      border: none;
      background: rgba(255, 255, 255, .1);
      padding: 7px 11px;
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      white-space: nowrap;
    }

    .btn.primary { background: rgba(255, 255, 255, .22); }
    .btn.danger { color: #ff9a9a; }
    .btn[disabled] { opacity: .45; }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }

    .info { flex: 1; min-width: 0; }
    .name { font-size: 13px; font-weight: 600; }

    .meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .on { color: var(--ok); }

    #status {
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }

    .empty {
      font-size: 12px;
      color: var(--muted);
      padding: 6px 2px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Extensions</h1>
      <button class="btn" id="back" type="button">Dashboard</button>
    </header>
    <div id="status"></div>

    <h2>Installed</h2>
    <div id="installed"><div class="empty">Loading…</div></div>

    <h2>Get add-ons</h2>
    <div id="recommended"></div>
  </main>

  <script>
    (function () {
      "use strict";

      // Firefox add-ons, installed from addons.mozilla.org (Firefox checks Mozilla's signature)
      const RECOMMENDED = [
        { id: "uBlock0@raymondhill.net", name: "uBlock Origin", about: "Blocks ads and trackers", slug: "ublock-origin" },
        { id: "addon@darkreader.org", name: "Dark Reader", about: "Dark mode for every website", slug: "darkreader" },
        { id: "vpn@proton.ch", name: "Proton VPN", about: "Browser VPN; sign in from its popup", slug: "proton-vpn-firefox-extension" }
      ];

      const installedEl = document.getElementById("installed");
      const recommendedEl = document.getElementById("recommended");
      const statusEl = document.getElementById("status");
      let installed = [];
      let pendingRemove = null;

      function api() {
        return window.TapLinkExtensions;
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function button(label, onTap, className) {
        const node = el("button", "btn" + (className ? " " + className : ""), label);
        node.type = "button";
        node.addEventListener("click", () => {
          console.log("extensions page: " + label);
          try {
            onTap();
          } catch (e) {
            console.error("extensions page: " + label + " failed: " + e);
            setStatus(label + " failed: " + e);
          }
        });
        return node;
      }

      function setStatus(text) {
        statusEl.textContent = text || "";
      }

      function renderInstalled() {
        installedEl.textContent = "";
        if (!installed.length) {
          installedEl.appendChild(el("div", "empty", "No add-ons installed yet."));
          return;
        }
        for (const ext of installed) {
          const row = el("div", "row");
          const info = el("div", "info");
          info.appendChild(el("div", "name", ext.name));
          const meta = el("div", "meta");
          const state = el("span", ext.enabled ? "on" : "", ext.enabled ? "On" : "Off");
          meta.appendChild(state);
          meta.appendChild(document.createTextNode(" · v" + ext.version));
          info.appendChild(meta);
          row.appendChild(info);

          if (ext.enabled && ext.hasPopup) {
            row.appendChild(button("Open", () => api().openPopup(ext.id), "primary"));
          }
          if (ext.enabled && ext.hasOptions) {
            row.appendChild(button("Settings", () => api().openOptions(ext.id)));
          }
          row.appendChild(button(ext.enabled ? "Turn off" : "Turn on", () => api().setEnabled(ext.id, !ext.enabled)));
          const confirming = pendingRemove === ext.id;
          row.appendChild(button(confirming ? "Tap to confirm" : "Remove", () => {
            if (pendingRemove === ext.id) {
              pendingRemove = null;
              api().uninstall(ext.id);
            } else {
              pendingRemove = ext.id;
              renderInstalled();
              setTimeout(() => {
                if (pendingRemove === ext.id) {
                  pendingRemove = null;
                  renderInstalled();
                }
              }, 4000);
            }
          }, "danger"));
          installedEl.appendChild(row);
        }
      }

      function renderRecommended() {
        recommendedEl.textContent = "";
        const ids = new Set(installed.map((ext) => ext.id));
        for (const addon of RECOMMENDED) {
          const row = el("div", "row");
          const info = el("div", "info");
          info.appendChild(el("div", "name", addon.name));
          info.appendChild(el("div", "meta", addon.about));
          row.appendChild(info);
          if (ids.has(addon.id)) {
            const done = button("Installed", () => {});
            done.disabled = true;
            row.appendChild(done);
          } else {
            row.appendChild(button("Install", () => {
              setStatus("Installing " + addon.name + "…");
              api().install("https://addons.mozilla.org/firefox/downloads/latest/" + addon.slug + "/latest.xpi");
            }, "primary"));
          }
          recommendedEl.appendChild(row);
        }
      }

      // Called by the app
      window.renderExtensions = function (list) {
        installed = Array.isArray(list) ? list : [];
        renderInstalled();
        renderRecommended();
      };
      window.extensionStatus = setStatus;

      document.getElementById("back").addEventListener("click", () => {
        location.assign("AR_Dashboard_Landscape_Sidebar.html");
      });

      renderRecommended();

      // Coming back to this page from history restores it without rerunning this script
      window.addEventListener("pageshow", (e) => {
        if (e.persisted && api()) api().refresh();
      });

      // The app's bridge defines TapLinkExtensions shortly after the page loads
      let tries = 0;
      (function waitForApi() {
        if (api()) {
          api().refresh();
        } else if (tries++ < 40) {
          setTimeout(waitForApi, 150);
        } else {
          installedEl.textContent = "";
          installedEl.appendChild(el("div", "empty", "Extensions need TapLink's GeckoView (Firefox) engine."));
          recommendedEl.textContent = "";
        }
      })();
    })();
  </script>
</body>
</html>
